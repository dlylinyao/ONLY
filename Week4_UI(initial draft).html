<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The ONLY Humorous YLE News</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
        .emoji-bg {
            position: fixed;
            top: 100%;
            font-size: 2rem;
            user-select: none;
            pointer-events: none;
            z-index: -1;
            animation: float 10s linear infinite;
        }
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.4);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-pop { animation: fadeIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .shimmer {
            background: linear-gradient(90deg, #fce7f3 25%, #fae8ff 50%, #fce7f3 75%);
            background-size: 200% 100%;
            animation: shimmer 1.2s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .gradient-text {
            background: linear-gradient(to right, #ec4899, #8b5cf6, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-100 via-purple-50 to-yellow-100 min-h-screen text-slate-800 font-sans overflow-x-hidden">

    <!-- Floating Emoji Background -->
    <div id="emoji-container"></div>

    <div id="app" class="max-w-4xl mx-auto p-6 md:pt-16 relative z-10">
        
        <!-- Search Page -->
        <div id="search-page" class="text-center">
            <div class="mb-10">
                <div class="inline-block px-4 py-1 rounded-full bg-white/50 text-pink-600 font-bold text-sm mb-4 border border-pink-200 shadow-sm">
                    ✨ Spark Joy with News ✨
                </div>
                <h1 class="text-5xl md:text-7xl font-black mb-6 gradient-text drop-shadow-sm">
                    The 'ONLY' Humorous YLE News
                </h1>
                <p class="text-purple-600 text-xl font-bold bg-white/30 inline-block px-6 py-2 rounded-2xl">
                    Discover humorous definitions and positive news! 🌈
                </p>
            </div>
            
            <div class="relative max-w-2xl mx-auto mb-16">
                <div class="absolute -inset-1 bg-gradient-to-r from-pink-400 via-purple-400 to-yellow-400 rounded-full blur opacity-30"></div>
                <input type="text" id="search-input" 
                    placeholder="Type something happy... Nature? Coffee? 🌸" 
                    class="relative w-full px-8 py-6 rounded-full border-none shadow-2xl focus:outline-none focus:ring-4 focus:ring-pink-300 text-xl transition-all bg-white">
                <button id="search-btn" onclick="handleSearch()" 
                    class="absolute right-3 top-3 bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 text-white px-10 py-3 rounded-full hover:scale-105 active:scale-95 transition-all font-black shadow-xl uppercase tracking-tighter">
                    Hunt! 🦄
                </button>
            </div>
        </div>

        <!-- Result Page -->
        <div id="result-page" class="hidden animate-pop">
            <button onclick="goBack()" class="mb-6 bg-white px-6 py-2 rounded-full text-pink-600 font-black flex items-center gap-2 transition-all hover:bg-pink-500 hover:text-white shadow-md">
                ← Back to Search 🎈
            </button>

            <div class="glass p-8 md:p-12 rounded-[3rem] shadow-2xl mb-8 relative overflow-hidden">
                <div class="absolute top-0 right-0 p-8 opacity-10 text-6xl">✨</div>
                
                <h2 id="result-keyword" class="text-4xl md:text-5xl font-black mb-8 text-transparent bg-clip-text bg-gradient-to-r from-pink-600 to-purple-600 capitalize"></h2>
                
                <div id="def-section" class="mb-10">
                    <div class="bg-gradient-to-r from-pink-50 to-purple-50 border-l-8 border-pink-500 p-8 rounded-3xl shadow-inner">
                        <h3 class="text-sm font-black text-pink-400 uppercase tracking-widest mb-2">the ONLY definition 😋</h3>
                        <p id="humorous-def" class="text-2xl font-bold text-slate-800 leading-tight italic">
                            <span class="inline-block w-4/5 h-8 shimmer rounded-lg"></span>
                        </p>
                    </div>
                </div>

                <div class="space-y-6">
                    <h3 class="text-2xl font-black text-purple-700 flex items-center gap-3">
                        News Related 🗞️
                    </h3>
                    <div id="news-loading" class="space-y-4">
                        <div class="p-6 bg-white/50 rounded-3xl shimmer h-24"></div>
                        <div class="p-6 bg-white/50 rounded-3xl shimmer h-24"></div>
                    </div>
                    <div id="news-sources" class="hidden space-y-4"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const apiKey = ""; 

        // Background Emoji Generator
        const emojis = ['🌞', '🌸', '✨', '🌈', '🍦', '🦄', '🥳', '🐶', '🍭', '🍕', '🎉'];
        function createEmojis() {
            const container = document.getElementById('emoji-container');
            const emoji = document.createElement('div');
            emoji.className = 'emoji-bg';
            emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            emoji.style.left = Math.random() * 100 + 'vw';
            emoji.style.animationDuration = (Math.random() * 5 + 5) + 's';
            container.appendChild(emoji);
            setTimeout(() => emoji.remove(), 10000);
        }
        setInterval(createEmojis, 500);

        function handleSearch() {
            const input = document.getElementById('search-input').value.trim();
            if (!input) return;

            document.getElementById('search-page').classList.add('hidden');
            document.getElementById('result-page').classList.remove('hidden');
            document.getElementById('result-keyword').innerText = input;
            document.getElementById('humorous-def').innerHTML = '<span class="inline-block w-full h-8 shimmer rounded-lg"></span>';
            document.getElementById('news-loading').classList.remove('hidden');
            document.getElementById('news-sources').classList.add('hidden');
            
            fetchNewsAndDef(input);
        }

        function goBack() {
            document.getElementById('search-page').classList.remove('hidden');
            document.getElementById('result-page').classList.add('hidden');
            document.getElementById('search-input').value = '';
        }

        async function fetchAI(payload) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            return await response.json();
        }

        async function fetchNewsAndDef(keyword) {
            // Priority 1: Get Grounded News
            const searchPrompt = `Find 3 recent positive news articles from site:yle.fi/news about "${keyword}" or related topics. You MUST return REAL titles and URLs.`;
            
            try {
                const searchResult = await fetchAI({
                    contents: [{ role: "user", parts: [{ text: searchPrompt }] }],
                    tools: [{ google_search: {} }]
                });

                const sources = searchResult.candidates?.[0]?.groundingMetadata?.groundingAttributions?.map(attr => ({
                    title: attr.web?.title || "YLE News Article",
                    url: attr.web?.uri
                })).filter(item => item.url && item.url.includes('yle.fi')).slice(0, 3) || [];

                renderNews(sources, keyword);

                // Priority 2: Get Unique Humorous Definition based on ACTUAL results
                const contextTitle = sources.length > 0 ? sources[0].title : `the latest happenings in ${keyword}`;
                const defPrompt = `Define "${keyword}" in exactly TWO short, humorous sentences. 
                Your definition MUST be directly related to the keyword "${keyword}" and this specific context: "${contextTitle}". 
                Maximum 15 words total. Do not mention "coffee" unless the keyword is coffee. Be witty.`;
                
                const defResult = await fetchAI({
                    contents: [{ role: "user", parts: [{ text: defPrompt }] }]
                });

                const aiText = defResult.candidates?.[0]?.content?.parts?.[0]?.text;
                if (aiText) {
                    document.getElementById('humorous-def').innerText = aiText.trim();
                } else {
                    document.getElementById('humorous-def').innerText = `${keyword} is the newest trend. Even the headlines can't keep up!`;
                }

            } catch (e) {
                renderNews([], keyword);
                document.getElementById('humorous-def').innerText = `${keyword} is currently causing a joyful scene. Check the links for more!`;
            }
        }

        function renderNews(sources, keyword) {
            const container = document.getElementById('news-sources');
            const loading = document.getElementById('news-loading');
            loading.classList.add('hidden');
            container.classList.remove('hidden');
            container.innerHTML = '';

            if (sources.length > 0) {
                sources.forEach(item => {
                    const card = document.createElement('div');
                    card.className = "p-6 bg-white rounded-[2rem] border-2 border-pink-100 shadow-md hover:shadow-xl hover:scale-[1.02] transition-all flex justify-between items-center group cursor-pointer overflow-hidden relative";
                    card.onclick = () => window.open(item.url, '_blank');
                    card.innerHTML = `
                        <div class="absolute inset-y-0 left-0 w-2 bg-gradient-to-b from-pink-400 to-purple-400"></div>
                        <div class="flex-1 ml-4">
                            <h4 class="text-slate-800 font-bold text-lg leading-tight group-hover:text-pink-600 transition-colors">
                                ${item.title}
                            </h4>
                            <div class="flex items-center mt-2">
                                <span class="text-xs font-black text-purple-400 uppercase tracking-widest bg-purple-50 px-3 py-1 rounded-full">Official YLE News</span>
                            </div>
                        </div>
                        <div class="bg-pink-500 text-white p-3 rounded-full ml-4 shadow-lg group-hover:bg-purple-500 transition-colors">
                            <span class="text-xl">🚀</span>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } else {
                container.innerHTML = `
                    <div class="p-10 bg-gradient-to-r from-yellow-400 to-orange-400 rounded-[2.5rem] text-white text-center shadow-2xl">
                        <p class="text-2xl font-black mb-6">Looking for YLE headlines about ${keyword}...</p>
                        <a href="https://yle.fi/news" target="_blank" class="bg-white text-orange-500 px-10 py-4 rounded-full font-black text-lg shadow-xl hover:scale-110 transition-transform inline-block">
                            Go Direct to YLE.fi ↗️
                        </a>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
