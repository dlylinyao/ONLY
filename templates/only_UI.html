<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONLY in Finland</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Syne:wght@700;800&display=swap"
        rel="stylesheet">

    <style>
        .font-syne {
            font-family: 'Syne', sans-serif;
        }

        .font-inter {
            font-family: 'Inter', sans-serif;
        }

        @keyframes float {
            0% {
                transform: translateY(0px) rotate(0deg);
                opacity: 0;
            }

            50% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .emoji-bg {
            position: fixed;
            top: 100%;
            font-size: 2rem;
            user-select: none;
            pointer-events: none;
            z-index: -1;
            animation: float 10s linear infinite;
        }

        .glass {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.4);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .animate-pop {
            animation: fadeIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .shimmer {
            background: linear-gradient(90deg, #fce7f3 25%, #fae8ff 50%, #fce7f3 75%);
            background-size: 200% 100%;
            animation: shimmer 1.2s infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .gradient-text {
            background: linear-gradient(to right, #ec4899, #8b5cf6, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .custom-select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.2rem center;
            background-repeat: no-repeat;
            background-size: 1.25em 1.25em;
            padding-right: 1.5rem;
        }

        .full-bleed-sky {
            width: 100vw;
            position: relative;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
        }

        #sky {
            width: 100%;
            position: relative; 
        }       

        @keyframes morph-1 {

            0%,
            100% {
                border-radius: 40% 60% 70% 30% / 40% 40% 60% 50%;
            }

            34% {
                border-radius: 70% 30% 50% 50% / 30% 30% 70% 70%;
            }

            67% {
                border-radius: 100% 60% 60% 100% / 100% 100% 60% 60%;
            }
        }

        @keyframes morph-2 {

            0%,
            100% {
                border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            }

            34% {
                border-radius: 30% 70% 70% 30% / 30% 70% 30% 70%;
            }

            67% {
                border-radius: 50% 50% 20% 80% / 25% 80% 20% 75%;
            }
        }

        @keyframes morph-3 {

            0%,
            100% {
                border-radius: 30% 70% 50% 50% / 50% 30% 70% 50%;
            }

            34% {
                border-radius: 50% 50% 70% 30% / 70% 50% 30% 50%;
            }

            67% {
                border-radius: 70% 30% 40% 60% / 30% 60% 40% 70%;
            }
        }

        .shape-1 {
            animation-name: morph-1;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
        }

        .shape-2 {
            animation-name: morph-2;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
        }

        .shape-3 {
            animation-name: morph-3;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
        }

        @keyframes float-cloud {

            0%,
            100% {
                transform: translate(-50%, -50%) translateY(0);
            }

            50% {
                transform: translate(-50%, -50%) translateY(-15px);
            }
        }

        .blob-node {
            position: absolute; 
            cursor: pointer;
            transform: translate(-50%, -50%); 
            user-select: none;
            z-index: 10;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .blob-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(2px);
            border: 3px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(236, 72, 153, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
            z-index: -1;
        }

        .blob-node:hover .blob-bg {
            border-color: #ec4899;
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.5);
        }

        .blob-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 15px;
            overflow: hidden;
            z-index: 2;
        }

        .topic-term {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            margin-bottom: 2px;
            color: #ec4899;
            text-align: center;
            word-wrap: break-word;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.8);
            letter-spacing: -0.5px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .topic-definition {
            display: none;
            color: #4b5563;
            font-size: 14px;
            margin-top: 8px;
            line-height: 1.4;
            padding-bottom: 10px;
            border-bottom: 2px dashed rgba(236, 72, 153, 0.3);
            font-style: italic;
            font-family: 'Inter', sans-serif;
        }

        .news-list {
            display: none;
            list-style: none;
            padding: 0;
            margin: 15px 0 0 0;
            width: 100%;
        }

        .news-item {
            margin-bottom: 10px;
            font-size: 13px;
            border-bottom: 1px dashed rgba(236, 72, 153, 0.2);
            padding-bottom: 8px;
            color: #333;
        }

        .news-item a {
            color: #4b5563;
            text-decoration: none;
            display: block;
            transition: color 0.2s;
            font-weight: bold;
            font-family: 'Inter', sans-serif;
        }

        .news-item a:hover {
            color: #8b5cf6;
            text-decoration: underline;
        }

        .blob-node.expanded {
            width: 340px !important;
            height: 420px !important;
            z-index: 1000;
            cursor: default;
        }

        .blob-node.expanded .blob-bg {
            animation: none !important;
            border-radius: 20px !important;
            background: rgba(255, 255, 255, 0.85);
            border-color: #fbcfe8;
            box-shadow: 0 20px 50px rgba(236, 72, 153, 0.15);
        }

        .blob-node.expanded .blob-content {
            justify-content: flex-start;
            align-items: flex-start;
            padding: 25px;
            overflow-y: auto;
        }

        .blob-node.expanded .topic-term {
            font-size: 22px !important;
            color: #8b5cf6;
            text-align: left;
            text-shadow: none;
            display: block;
            -webkit-line-clamp: unset;
            line-clamp: unset;
        }

        .blob-node.expanded .topic-definition {
            display: block;
        }

        .blob-node.expanded .news-list {
            display: block;
        }

        .floating {
            animation: float-cloud 5s ease-in-out infinite;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 192, 203, 0.8);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(236, 72, 153, 0.8);
        }
    </style>
</head>

<body
    class="bg-gradient-to-br from-pink-100 via-purple-50 to-yellow-100 min-h-screen text-slate-800 font-sans overflow-x-hidden">

    <div id="emoji-container"></div>

    <div id="app" class="max-w-4xl mx-auto p-6 md:pt-16 relative z-10">

        <div id="hero-section" class="text-center mb-10 transition-all duration-500">
            <div
                class="inline-block px-4 py-1 rounded-sm bg-white/50 text-pink-600 font-bold text-xs mb-4 border border-pink-200 shadow-sm uppercase tracking-[1px] font-inter">
                BASED ON YLE NEWS ARTICLES - UPDATED DAILY.
            </div>
            <h1 class="text-5xl md:text-7xl font-syne font-[800] mb-6 gradient-text drop-shadow-sm">
                ONLY in Finland
            </h1>
            <p
                class="text-purple-600 text-xl font-bold bg-white/30 inline-block px-6 py-2 rounded-2xl font-inter font-[400]">
                > Ordinary words. Extraordinary meanings 💅
            </p>
        </div>

        <div id="search-bar-container" class="sticky top-4 z-50 max-w-3xl mx-auto mb-10 transition-all duration-300">
            <div class="relative flex items-center glass rounded-full shadow-2xl">
                <input type="text" id="search-input" placeholder="Type something..."
                    class="w-full pl-8 pr-80 py-6 rounded-full border-none focus:outline-none focus:ring-4 focus:ring-pink-300 bg-transparent text-xl transition-all text-slate-800 font-inter placeholder-slate-500">

                <div class="absolute right-40 z-20 flex items-center h-full">
                    <select id="mode-select"
                        class="custom-select bg-white/80 border border-pink-200 text-purple-700 py-2 pl-3 rounded-lg font-inter text-xs hover:bg-white focus:outline-none focus:ring-2 focus:ring-pink-300 transition-all cursor-pointer shadow-sm backdrop-blur-md">
                        <option value="tfidf" selected>TF-IDF</option>
                        <option value="boolean">Boolean</option>
                        <option value="semantic">Semantic</option>
                    </select>
                </div>

                <button id="search-btn" onclick="handleSearch()"
                    class="absolute right-3 z-10 bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 text-white px-8 py-3 rounded-full hover:scale-105 active:scale-95 transition-all font-inter font-bold shadow-xl uppercase tracking-tighter">
                    REDEFINE
                </button>
            </div>
        </div>

        <div id="explore-page" class="animate-pop full-bleed-sky transition-all duration-500 mt-10">
            <div id="sky" class="w-full"></div>
        </div>

        <div id="result-page" class="hidden animate-pop pb-10 mt-10">
            <button onclick="goBack()"
                class="mb-6 bg-white/80 backdrop-blur-md px-6 py-2 rounded-full text-pink-600 font-inter font-bold flex items-center gap-2 transition-all hover:bg-pink-500 hover:text-white shadow-md border border-white">
                ← Back
            </button>

            <div class="glass p-8 md:p-12 rounded-[3rem] shadow-2xl mb-8 relative overflow-hidden bg-white/80">
                <div class="absolute top-0 right-0 p-8 opacity-10 text-6xl font-syne">✨</div>

                <h2 id="result-keyword"
                    class="text-4xl md:text-5xl font-[800] mb-8 text-transparent bg-clip-text bg-gradient-to-r from-pink-600 to-purple-600 capitalize font-syne">
                </h2>

                <div id="def-section" class="mb-10">
                    <div
                        class="bg-gradient-to-r from-pink-50 to-purple-50 border-l-8 border-pink-500 p-8 rounded-3xl shadow-inner">
                        <h3 class="text-sm font-inter font-bold text-pink-400 uppercase tracking-widest mb-2">Latest
                            Definition in Finland</h3>
                        <p id="humorous-def" class="text-2xl font-[400] text-slate-800 leading-tight italic font-inter">
                            <span class="inline-block w-4/5 h-8 shimmer rounded-lg"></span>
                        </p>
                    </div>
                </div>

                <div class="space-y-6">
                    <h3 class="text-2xl font-inter font-bold text-purple-700 flex items-center gap-3"
                        id="results-title">
                        References 📖
                    </h3>
                    <div id="news-loading" class="space-y-4">
                        <div class="p-6 bg-white/50 rounded-3xl shimmer h-24"></div>
                        <div class="p-6 bg-white/50 rounded-3xl shimmer h-24"></div>
                    </div>
                    <div id="news-sources" class="hidden space-y-4"></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const emojis = ['🍬', '🌸', '🧩', '🍬', '✨', '🌸', '✨', '🧩'];
        function createEmojis() {
            const container = document.getElementById('emoji-container');
            const emoji = document.createElement('div');
            emoji.className = 'emoji-bg';
            emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            emoji.style.left = Math.random() * 100 + 'vw';
            emoji.style.animationDuration = (Math.random() * 5 + 5) + 's';
            container.appendChild(emoji);
            setTimeout(() => emoji.remove(), 10000);
        }
        setInterval(createEmojis, 500);

        function handleSearch() {
            const input = document.getElementById('search-input').value.trim();
            const modeSelect = document.getElementById('mode-select').value;

            if (!input) return;

            document.getElementById('hero-section').classList.add('hidden');
            document.getElementById('search-bar-container').classList.add('hidden');
            document.getElementById('explore-page').classList.add('hidden');
            
            document.getElementById('result-page').classList.remove('hidden');

            document.getElementById('result-keyword').innerText = input;
            document.getElementById('results-title').innerText = `References 📖`;

            document.getElementById('def-section').classList.remove('hidden');
            document.getElementById('humorous-def').innerHTML = '<span class="inline-block w-full h-8 shimmer rounded-lg"></span>';

            document.getElementById('news-loading').classList.remove('hidden');
            document.getElementById('news-sources').classList.add('hidden');

            window.scrollTo({ top: 0, behavior: 'instant' });

            fetchSearchResults(input, modeSelect);
            fetchHumorousDefinition(input);
        }

        function goBack() {

            document.getElementById('result-page').classList.add('hidden');
            
            document.getElementById('hero-section').classList.remove('hidden');
            document.getElementById('search-bar-container').classList.remove('hidden');
            document.getElementById('explore-page').classList.remove('hidden');

            document.getElementById('search-input').value = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function fetchSearchResults(keyword, mode) {
            try {
                const response = await fetch("/search", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query: keyword, mode: mode })
                });
                const results = await response.json();
                renderResults(results, mode);
            } catch (err) {
                console.error(err);
                renderError("Search failed. Please try again later.");
            }
        }

        async function fetchHumorousDefinition(keyword) {
            const modeSelect = document.getElementById('mode-select').value;

            try {
                const response = await fetch("/define", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query: keyword, mode: modeSelect })
                });

                if (!response.ok) throw new Error("Server returned " + response.status);

                const data = await response.json();
                const aiText = data.definition;
                document.getElementById('humorous-def').innerText = aiText ? aiText.trim() : `${keyword} is a mystery wrapped in an enigma. 🦄`;

            } catch (e) {
                console.error("Definition Generation failed", e);
                document.getElementById('humorous-def').innerText = `Ollama connection failed. Is your RAG backend fully integrated?`;
            }
        }

        function renderError(message) {
            const container = document.getElementById("news-sources");
            document.getElementById("news-loading").classList.add("hidden");
            container.classList.remove("hidden");
            container.innerHTML = `<div class="p-8 bg-red-100 rounded-2xl text-center font-inter font-bold text-red-600">${message}</div>`;
        }

        function renderResults(results, mode) {
            const container = document.getElementById("news-sources");
            document.getElementById("news-loading").classList.add("hidden");
            container.classList.remove("hidden");
            container.innerHTML = "";
            if (!results || results.length === 0) {
                container.innerHTML = `<div class="p-8 bg-yellow-100 rounded-2xl text-center font-inter font-bold text-yellow-700">No relevant documents found. Yeah, I was just making stuff up 🫣</div>`;
                return;
            }
            results.forEach(item => {
                const card = document.createElement("div");
                card.className = "p-6 bg-white rounded-[2rem] border-2 border-pink-100 shadow-md hover:shadow-xl transition-all mb-4 font-inter";
                card.innerHTML = `<p class="text-slate-700 text-sm leading-relaxed">${item.content.substring(0, 300)}...</p>`;
                container.appendChild(card);
            });
        }

        document.getElementById("search-input").addEventListener("keypress", function (event) {
            if (event.key === "Enter") { event.preventDefault(); handleSearch(); }
        });

        function initSkyPlot() {
            function getRadius(d) {
                const count = d.count || (d.articles ? d.articles.length : 0) || 5;
                const r = 90 + count * 5;
                return isNaN(r) ? 100 : Math.min(r, 180);
            }

            const extractTerm = (text) => text.includes(':') ? text.split(':')[0].trim() : text;
            const extractDefinition = (text) => text.includes(':') ? text.substring(text.indexOf(':') + 1).trim() : '';

            let width = window.innerWidth;
            const sky = d3.select("#sky");

            d3.json("/api/topic_data").then(data => {
                if (!data || data.length === 0) {
                    sky.html("<h2 style='text-align:center; padding-top:20%; color: #555; font-family: Inter, sans-serif;'>Data is empty!</h2>");
                    return;
                }

                const totalHeight = Math.max(window.innerHeight, data.length * 150);
                sky.style("height", totalHeight + "px");

                const nodes = data.map((d, i) => ({
                    ...d,
                    x: width / 2 + (Math.random() - 0.5) * (width * 0.8),
                    y: (i / data.length) * (totalHeight - 300) + 100, 
                    radius: getRadius(d),
                    shapeClass: "shape-" + (Math.floor(Math.random() * 3) + 1),
                    animDuration: (6 + Math.random() * 5).toFixed(2) + "s",
                    animDelay: "-" + (Math.random() * 10).toFixed(2) + "s"
                }));

                const simulation = d3.forceSimulation(nodes)
                    .force("charge", d3.forceManyBody().strength(80))
                    .force("x", d3.forceX(width / 2).strength(0.015))
                    .force("y", d3.forceY(d => d.y).strength(0.1))
                    .force("collide", d3.forceCollide().radius(d => d.radius + 15).iterations(3))
                    .alphaDecay(0.02);

                const blobs = sky.selectAll(".blob-node")
                    .data(nodes)
                    .enter()
                    .append("div")
                    .attr("class", "blob-node floating")
                    .style("width", d => d.radius * 1.5 + "px") 
                    .style("height", d => d.radius * 1.5 + "px");

                blobs.append("div")
                    .attr("class", d => "blob-bg " + d.shapeClass)
                    .style("animation-duration", d => d.animDuration)
                    .style("animation-delay", d => d.animDelay);

                const content = blobs.append("div")
                    .attr("class", "blob-content");

                content.append("div")
                    .attr("class", "topic-term")
                    .style("font-size", d => {
                        const scale = d.radius / 100;
                        return Math.max(14, Math.min(18 * scale, 28)) + "px";
                    })
                    .text(d => extractTerm(d.topic));

                content.append("div")
                    .attr("class", "topic-definition")
                    .text(d => extractDefinition(d.topic));

                const lists = content.append("ul").attr("class", "news-list");
                lists.selectAll("li")
                    .data(d => d.articles || [])
                    .enter()
                    .append("li").attr("class", "news-item")
                    .append("a")
                    .attr("href", a => a.url || '#')
                    .attr("target", "_blank")
                    .text(a => (a && a.headline && a.headline !== "n/a") ? a.headline : "Read Full Article");

                simulation.on("tick", () => {
                    const currentWidth = window.innerWidth;
                    blobs
                        .style("left", d => {
                            const paddingX = d.radius;
                            d.x = Math.max(paddingX, Math.min(currentWidth - paddingX, d.x));
                            return `${d.x}px`;
                        })
                        .style("top", d => {
                            const paddingY = d.radius;
                            d.y = Math.max(paddingY, Math.min(totalHeight - paddingY - 50, d.y));
                            return `${d.y}px`;
                        });
                });

                blobs.on("click", function (event, d) {
                    event.stopPropagation();
                    if (event.target.tagName === "A") return;

                    const node = d3.select(this);
                    const isExp = node.classed("expanded");

                    if (!isExp) {
                        sky.selectAll(".blob-node.expanded").each(function(n) {
                            d3.select(this).classed("expanded", false).classed("floating", true);
                            n.fx = null; n.fy = null;
                        });

                        node.classed("expanded", true).classed("floating", false);
                        d.fx = d.x; d.fy = d.y; 
                        simulation.force("collide").radius(n => n === d ? 240 : n.radius + 15);
                    } else {
                        node.classed("expanded", false).classed("floating", true);
                        d.fx = null; d.fy = null;
                        simulation.force("collide").radius(n => n.radius + 15);
                    }
                    simulation.alpha(0.8).restart();
                });

                sky.on("click", function (event) {
                    if (event.target === this || event.target.id === 'sky' || event.target.id === 'explore-page') {
                        const expandedBlobs = sky.selectAll(".blob-node.expanded");
                        if (!expandedBlobs.empty()) {
                            expandedBlobs.each(function(d) {
                                d3.select(this).classed("expanded", false).classed("floating", true);
                                d.fx = null; d.fy = null;
                            });
                            simulation.force("collide").radius(n => n.radius + 15);
                            simulation.alpha(0.8).restart();
                        }
                    }
                });

                window.addEventListener('resize', () => {
                    simulation.force("x", d3.forceX(window.innerWidth / 2).strength(0.015));
                    simulation.alpha(0.3).restart();
                });

            }).catch(err => {
                console.error("Failed to load data:", err);
                sky.html("<h2 style='text-align:center; padding-top:20%; color: #555; font-family: Inter, sans-serif;'>Failed to load background data.</h2>");
            });
        }

        initSkyPlot();
    </script>
</body>

</html>
